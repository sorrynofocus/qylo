# Compose definition for the Qylo container and its optional llama.cpp sibling.
#
# Purpose:
# Wires the CLI container to a local model server without anyone having to remember
# container networking details. The `local` profile brings up llama-server; without
# it, only the chatbot service exists and the Azure provider is assumed.
#
# Usage examples (see infra/docker/README.md for granular details):
#
# Run from the REPOSITORY ROOT, always with -f:
#
# One question against Azure:
# docker compose -f infra/docker/docker-compose.yml run --rm chatbot "What is flogger?"
#
# Bring up the local model, then ask it something. The `run` blocks until the
# healthcheck below passes, so there is no need to sleep or poll by hand:
# docker compose -f infra/docker/docker-compose.yml --profile local up -d llama
# docker compose -f infra/docker/docker-compose.yml --profile local run --rm \
#   -e CHATBOT_MODEL_PROVIDER=local chatbot "What is flogger?"
#
# To watch the model load instead of waiting blind:
# docker inspect --format '{{.State.Health.Status}}' \
#   $(docker compose -f infra/docker/docker-compose.yml --profile local ps -q llama)
#
# Tear down (add -v to also drop the downloaded-model volume):
# docker compose -f infra/docker/docker-compose.yml --profile local down

# NOTE ON PATHS: compose resolves relative paths against THIS FILE's directory,
# not your shell's working directory. Hence ../../ everywhere - it points at the
# repo root regardless of where the command is run from.

services:

  # The CLI. One-shot by design: it answers and exits, so `run --rm` fits it
  # better than `up`.
  chatbot:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        # Default build bakes the Qwen weights in (~8GB) for a fully offline image.
        # Override to 0 for the ~1.5GB Azure-only build.
        BAKE_LLM_WEIGHTS: ${BAKE_LLM_WEIGHTS:-1}
    image: qylo:latest
    env_file:
      - ../../.env
    environment:
      # Overrides .env's localhost value. Inside a container, "localhost" is the
      # container itself, so the .env setting would point at nothing. "llama" is
      # the service name below, which compose resolves on the shared network.
      #
      # If you instead run llama-server on the HOST, drop this override, set
      # LOCAL_OPENAI_BASE_URL=http://host.docker.internal:8080/v1 in .env, and
      # uncomment the extra_hosts block.
      LOCAL_OPENAI_BASE_URL: http://llama:8080/v1
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      # The knowledge base, read-only. Swap corpora without rebuilding the image.
      - ../../data/documents:/app/data/documents:ro
      # Where --usagelog writes.
      - ../../logs:/app/logs
    depends_on:
      llama:
        condition: service_healthy
        required: false

  # llama.cpp's OpenAI-compatible server. Same image as the chatbot - the
  # entrypoint's `serve` mode starts the server instead of the CLI.
  llama:
    profiles: ["local"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        BAKE_LLM_WEIGHTS: ${BAKE_LLM_WEIGHTS:-1}
    image: qylo:latest
    command: ["serve"]
    ports:
      - "8080:8080"
    volumes:
      # Only used when the image was built with BAKE_LLM_WEIGHTS=0; then the
      # first start downloads ~6.5GB here so later containers reuse it.
      - llama-models:/models
    healthcheck:
      # chatbot waits on this, so it does not fire a request at a server still
      # loading 6.5GB of weights off disk.
      #
      # Python, NOT curl. The runtime stage installs libcurl4 - the shared library
      # llama-server links against for its own -hf downloads - but no curl or wget
      # BINARY (verified: both exit 127 in the image). The obvious
      # ["CMD","curl",...] probe could therefore never pass, so llama never
      # reported healthy and --profile local could never come up. Python needs no
      # new package: the base image is python:3.12-slim-bookworm.
      #
      # No try/except is needed. urlopen raises HTTPError on any non-2xx -
      # llama-server answers /health with 503 while the model is still loading -
      # and URLError on a refused connection. An uncaught exception exits 1, which
      # is exactly Docker's "unhealthy".
      #
      # CMD (not CMD-SHELL) execs directly with no shell, so the whole program has
      # to be one argv element, and the port must be the literal 8080 - there is no
      # shell to expand $LLAMA_PORT.
      test:
        - CMD
        - python3
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      # Generous: a cold start with no baked weights includes the model download.
      start_period: 300s

volumes:
  llama-models:
