# Cwinters / US / Arizona / ThinkPad T15g Gen 1
# 2026.08.07
# Builds the Qylo container image and smoke-tests it.
#
# Purpose:
# Prove the image still builds from a clean checkout and that the resulting binaries and
# caches actually work, without needing anything preinstalled on the runner.
#
# STATUS: VERIFIED. First execution 2026-08-08 (run 31290501806) passed on the first
# attempt, every step green in 32m57s, producing a 9.63GB image - byte-for-byte the same
# size as the locally built one. The air-gapped claim was independently reconfirmed here:
# the offline smoke test ran under `--network none` and still printed tiktoken vocab
# 100277 and embedding dims 384, so nothing was fetched at runtime.
#
# The disk exhaustion this file originally predicted did not happen, and was never close.
# See "WHERE THE TIME GOES" below for the constraint that actually binds.

name: docker

# on:
#   push:
#     branches: ["**"]
#   pull_request:
#   workflow_dispatch:
#     inputs:
#       bake_llm_weights:
#         description: "Bake the ~6.5GB Qwen GGUF into the image (1) or build the slim Azure-only image (0)"
#         required: false
#         default: "1"
#         type: choice
#         options: ["1", "0"]

on:
  workflow_dispatch:
    inputs:
      bake_llm_weights:
        description: "Bake the ~6.5GB Qwen GGUF into the image (1) or build the slim Azure-only image (0)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      IMAGE: qylo:ci
      # Default build bakes the weights. workflow_dispatch can override to 0.
      BAKE_LLM_WEIGHTS: ${{ github.event.inputs.bake_llm_weights || '1' }}

    steps:
      # ---------------------------------------------------------------------
      # WHERE THE TIME GOES  (measured, run 31290501806, 2026-08-08)
      #
      # Disk is not the constraint, despite what this comment used to claim.
      # The runner arrived with a 145G root and 88G already free; this step took
      # it to 107G. Of the ~19G reclaimed, only 1.851GB came from the docker
      # prune - the rest was the preinstalled dotnet/android/boost/CodeQL trees.
      # No ENOSPC anywhere in the logs. The step is kept as cheap insurance
      # (1m36s) against a future runner image shipping fuller, not because the
      # baked build needs it today.
      #
      # The actual cost, biggest line items inside a 30m43s build step (these
      # stages overlap, so they do not sum to the total):
      #   18m52s  exporting layers to the GitHub Actions cache   <- 57% of build
      #    5m36s  llama.cpp cmake build
      #    6m00s  exporting + importing the docker image format
      #      31s  downloading the 6.5GB Qwen GGUF   <- never the bottleneck
      #
      # So the thing to attack, if this ever needs to be faster, is `cache-to`
      # further down. `mode=max` writes the whole ~9.6GB image against a 10GB
      # per-repository Actions cache quota, so it sits at the ceiling and will
      # evict rather than hit - the cold first run recorded zero CACHED steps.
      # Options: mode=min, scope the cache to just the llamacpp-builder stage,
      # or drop type=gha entirely. As configured it spends ~19 minutes to save
      # at most the ~6 minutes of compile it could replay.
      #
      # If a run ever DOES die with ENOSPC, the original ladder still stands:
      #   1. Confirm this step ran and freed what it claims (see df output).
      #   2. Re-run with bake_llm_weights=0. If that is green, the problem is
      #      purely the model size, not the build.
      #   3. Swap the llamacpp-builder stage for a pinned prebuilt tarball
      #      (llama-<ref>-bin-ubuntu-x64.tar.gz) IN CI ONLY, leaving local
      #      builds compiling from source.
      #   4. Move the baked build to a self-hosted runner, or build it on the
      #      target VM and skip CI for that variant.
      # ---------------------------------------------------------------------
      - name: Reclaim runner disk
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "After:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root, NOT infra/docker - the build needs src/,
          # pyproject.toml, uv.lock, README.md and data/.
          context: .
          file: infra/docker/Dockerfile
          build-args: |
            BAKE_LLM_WEIGHTS=${{ env.BAKE_LLM_WEIGHTS }}
          tags: ${{ env.IMAGE }}
          # Build-only: there is no registry configured yet. Load into the local
          # daemon so the smoke checks below can run against it.
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: docker image ls ${{ env.IMAGE }}

      # Mirrors the manual "Verification" checks in the root README.
      - name: Smoke - CLI responds
        run: docker run --rm ${{ env.IMAGE }} --help

      # This step used to point at /app/src, which does not exist in the runtime
      # image - the runtime stage copies .venv and the caches, never the source
      # tree, because --no-editable puts the package in site-packages instead
      # (Dockerfile:157-163). compileall on a missing directory prints
      # "Can't list" and exits 0, so the step passed no matter how broken the
      # code was. Resolving the package through its own __file__ instead of a
      # hardcoded site-packages path keeps this honest across a Python version
      # bump. PYTHONPYCACHEPREFIX is insurance rather than a requirement:
      # site-packages is appuser-owned today (Dockerfile:293 chowns /app), so
      # .pyc writes do succeed without it - but a smoke check has no business
      # mutating the venv it is inspecting, and if that chown ever changes this
      # step would fail on permissions rather than on real syntax errors.
      - name: Smoke - sources compile inside the image
        run: |
          docker run --rm \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            --entrypoint python ${{ env.IMAGE }} -c "
          import compileall, pathlib, sys, qylo
          pkg = pathlib.Path(qylo.__file__).parent
          print('compiling', pkg)
          sys.exit(0 if compileall.compile_dir(str(pkg), quiet=1, force=True) else 1)
          "

      # Proves the from-source llama.cpp build produced a binary that actually
      # runs on this CPU - i.e. that GGML_NATIVE=OFF did its job.
      - name: Smoke - llama.cpp binary runs
        run: docker run --rm --entrypoint llama-server ${{ env.IMAGE }} --version

      # The load-bearing test: with no network at all, the baked caches must be
      # sufficient. A HuggingFace or tiktoken download attempt here means a cache
      # did not bake correctly, and the "works air-gapped" claim is false.
      - name: Smoke - offline caches resolve
        run: |
          docker run --rm --network none --entrypoint python ${{ env.IMAGE }} -c "
          import tiktoken
          from langchain_huggingface import HuggingFaceEmbeddings
          print('tiktoken vocab:', tiktoken.get_encoding('cl100k_base').n_vocab)
          e = HuggingFaceEmbeddings(model_name='sentence-transformers/all-MiniLM-L6-v2')
          print('embedding dims:', len(e.embed_query('hello')))
          "

      - name: Smoke - weights present when baked
        if: env.BAKE_LLM_WEIGHTS == '1'
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE }} -c \
            'ls -lh /opt/models/qwen/*.gguf' \
            || { echo "::error::BAKE_LLM_WEIGHTS=1 but no .gguf in the image"; exit 1; }
